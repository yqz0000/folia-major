# =============================================================
# Build Folia iOS IPA（chthollyphile/folia-major → iPhone 安装包）
#
# 原理：
#   1. 在 GitHub 的 macOS 云主机（自带 Xcode）上运行
#   2. 执行 folia-major 的 `npm run build` 产出 Web 静态包 (dist/)
#   3. 用 Capacitor 把 dist/ 包成一个原生壳 App（WKWebView 加载）
#   4. 用 xcodebuild 编译出 .app，再打包成未签名 .ipa
#
# 触发方式：仓库 Actions 页面 → 本工作流 → Run workflow（手动）
#
# 可选输入（不填则用仓库默认值）：
#   NETEASE_API_BASE：网易云 API 地址（VITE_NETEASE_API_BASE），
#                     默认 http://localhost:3000（手机上不可达，二维码会刷不出来）
#   QQ_API_BASE：QQ 音乐 API 地址（VITE_QQ_API_BASE），
#                不填则 QQ 音乐灰色不可用（Web/开发构建必须指向可达的 API 实例）
#   KUGOU_API_BASE：酷狗 API 地址（VITE_KUGOU_API_BASE），
#                   不填则酷狗灰色不可用（Web 端留空默认禁用）
#
# 产物：未签名 IPA → 下载后用爱思助手用自己的 Apple ID 签名侧载
# =============================================================
name: Build Folia iOS IPA

on:
  workflow_dispatch:        # 手动触发，可填 API 地址
    inputs:
      netease_api_base:
        description: 网易云 API 地址（VITE_NETEASE_API_BASE），如 https://your-xxx.vercel.app；留空则用仓库默认
        required: false
        default: ''
      qq_api_base:
        description: QQ 音乐 API 地址（VITE_QQ_API_BASE），如 https://your-xxx.vercel.app；留空则 QQ 灰色
        required: false
        default: ''
      kugou_api_base:
        description: 酷狗 API 地址（VITE_KUGOU_API_BASE），如 https://your-xxx.vercel.app；留空则酷狗灰色
        required: false
        default: ''
  push:
    tags:
      - "v*"                # 可选：推送 v 标签时自动触发

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js (from .nvmrc, Node 24)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Folia web bundle (with optional API bases)
        run: |
          if [ -n "${{ inputs.netease_api_base }}" ]; then
            echo "VITE_NETEASE_API_BASE=${{ inputs.netease_api_base }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ inputs.qq_api_base }}" ]; then
            echo "VITE_QQ_API_BASE=${{ inputs.qq_api_base }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ inputs.kugou_api_base }}" ]; then
            echo "VITE_KUGOU_API_BASE=${{ inputs.kugou_api_base }}" >> "$GITHUB_ENV"
          fi
          npm run build

      - name: Scaffold Capacitor iOS wrapper
        run: |
          npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/ios@^7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "top.izuna.foliamajor",
            "appName": "Folia",
            "webDir": "dist"
          }
          EOF
          npx cap add ios
          npx cap sync ios

      - name: Tweak Info.plist (display name, background audio, allow HTTP APIs)
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Folia" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Folia" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          # 允许访问 http:// 的 API 地址（如局域网内自建的 API 服务）
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"

      - name: Build .app (no code signing)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "Folia-${{ github.run_number }}.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: folia-ipa
          path: "Folia-*.ipa"
